<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Essence Québec - Prix à la pompe</title>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <div id="sidebar">
      <div id="sidebar-handle">
        <div class="handle-bar"></div>
        <div class="sidebar-header">
          <span class="sidebar-title" data-i18n="results">Résultats</span>
          <span class="station-count-badge" id="sidebar-station-count" data-count="0">0 stations</span>
        </div>
      </div>

      <div id="sidebar-content">
        <div class="quick-stats" id="quick-stats">
          <div class="quick-stat-item">
            <span class="quick-stat-label" data-i18n="regular">Régulier</span>
            <span class="quick-stat-value lowest" id="quick-regular">—</span>
          </div>
          <div class="quick-stat-item">
            <span class="quick-stat-label" data-i18n="super">Super</span>
            <span class="quick-stat-value" id="quick-super">—</span>
          </div>
          <div class="quick-stat-item">
            <span class="quick-stat-label" data-i18n="diesel">Diesel</span>
            <span class="quick-stat-value" id="quick-diesel">—</span>
          </div>
        </div>

        <div class="filter-toggle" id="filter-toggle">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
          </svg>
          <span data-i18n="filters">Filtres</span>
          <svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </div>

        <div class="filter-panel" id="filter-panel">
          <div class="control-group">
            <label data-i18n="brand">Marque</label>
            <div class="filter-row" id="brand-filters"></div>
            <button class="show-more-btn" id="show-more-brands" data-i18n="showMoreBrands">+ Plus de marques</button>
            <div class="more-brands" id="more-brands" style="display:none;"></div>
          </div>

          <div class="control-group">
            <label data-i18n="fuel">Type de carburant</label>
            <div class="fuel-grid">
              <label class="fuel-chip">
                <input type="radio" name="fuel-type" class="fuel-filter" value="regular" checked>
                <span class="fuel-chip-label" data-fuel="regular">Régulier</span>
              </label>
              <label class="fuel-chip">
                <input type="radio" name="fuel-type" class="fuel-filter" value="super">
                <span class="fuel-chip-label" data-fuel="super">Super</span>
              </label>
              <label class="fuel-chip">
                <input type="radio" name="fuel-type" class="fuel-filter" value="diesel">
                <span class="fuel-chip-label" data-fuel="diesel">Diesel</span>
              </label>
            </div>
          </div>

          <div class="control-group">
            <label data-i18n="priceRange">Plage de prix (¢/L)</label>
            <div class="price-range-wrap">
              <input type="range" class="price-slider" id="min-price" min="150" max="240" value="150" step="1">
              <div class="price-range-values">
                <span id="min-price-val">1.50$</span>
                <span>—</span>
                <span id="max-price-val">2.40$</span>
              </div>
              <input type="range" class="price-slider" id="max-price" min="150" max="240" value="240" step="1">
            </div>
          </div>

          <div class="control-group">
            <label data-i18n="region">Région</label>
            <select class="region-select" id="region-filter">
              <option value="">Toutes</option>
            </select>
          </div>
        </div>

        <div class="station-list-section">
          <div class="section-header" id="station-list-header">
            <span data-i18n="stations">Stations</span>
            <span class="sort-hint" data-i18n="sortByPrice">trié par prix</span>
          </div>
          <div id="station-list"></div>
        </div>
      </div>
    </div>

    <div id="map-container">
      <div id="header">
        <h1 id="title" data-i18n="title">⛽ Essence Québec</h1>
        <div id="data-status" class="data-status" data-i18n="dataLoading">Données: en chargement...</div>
      </div>

      <div id="locate-btn" class="map-fab" title="定位 / Locate">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M12 2v4m0 12v4M2 12h4m12 0h4"></path>
        </svg>
      </div>

      <div id="radius-control" class="map-overlay-control">
        <div class="radius-label" data-i18n="radius">Rayon</div>
        <div class="radius-buttons">
          <button class="radius-btn" data-radius="5">5km</button>
          <button class="radius-btn" data-radius="10">10km</button>
          <button class="radius-btn active" data-radius="25">25km</button>
          <button class="radius-btn" data-radius="50">50km</button>
        </div>
      </div>

      <div id="loading">
        <div class="spinner"></div>
        <div id="loading-text" data-i18n="loading">Chargement...</div>
      </div>

      <div id="legend">
        <div class="legend-bar"></div>
        <div class="legend-labels">
          <span data-i18n="lowPrice">1.65$</span>
          <span data-i18n="highPrice">2.00$</span>
        </div>
      </div>

      <div id="map"></div>
    </div>
  </div>

  <script defer src="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js"></script>
  <script type="module" src="js/i18n.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
