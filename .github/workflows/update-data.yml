name: Update Gas Prices Data

on:
  workflow_call:

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download and process data
        continue-on-error: true
        run: |
           python scripts/download_data.py || echo "No new data or download failed"
           python scripts/process_data.py || echo "Processing failed"

      - name: Commit and push if changed
        continue-on-error: true
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/stations.json data/stats.json
          git diff-index --quiet HEAD || git commit -m "Update gas prices data [skip ci]" || echo "Nothing to commit"
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git || echo "Push failed or no changes"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}