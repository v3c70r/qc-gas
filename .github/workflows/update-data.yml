name: Update Gas Prices Data

on:
  workflow_call:
    outputs:
      due:
        description: 'true when this run actually polled the upstream price source'
        value: ${{ jobs.update-data.outputs.due }}

jobs:
  update-data:
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.gate.outputs.due }}
    # Single source of truth for the fetch rhythm (issue #67): both the gate
    # (`should_fetch.py`) and the schedule writer (`update_profile.py`) read
    # these, so the plan and the gate can never disagree. Changing the rhythm =
    # editing this env block only; the constants in `scripts/fetch_strategy.py`
    # are just the local fallback.
    env:
      # `#91` shipped an explicit local *timetable* (busy 20 min, midnight 10 min,
      # night 1/h) inside `data/fetch-schedule.json`; `#93` wakes the workflow
      # every 5 minutes from a local `crontab` (`repository_dispatch`) and lets
      # the gate admit exactly the timetable's slots. So the budget is no longer
      # "one request per fallback wake" (the old #77 rule): it must equal the
      # plan's slot count, otherwise the next successful fetch would rewrite the
      # committed timetable with a smaller budget and break the busy-hour
      # cadence the dispatch trigger exists for. `scripts/trigger_interval_report.py`
      # checks `budget == timetable slots/day` and fails the report otherwise.
      FETCH_DAILY_BUDGET: '65'
      # Freshness safety net: force a poll when the last one is older than 120
      # minutes = two *fallback* cron wake-ups. Kept at exactly 2 x the hourly
      # fallback interval so the safety net can neither be denser nor sparser
      # than the fallback it backs up (the 5-minute dispatch wakes are far
      # denser; they are gated by the timetable, not by this net).
      FETCH_MAX_AGE_MINUTES: '120'
      # Epsilon-greedy exploration (issue #69): share of the daily budget spent
      # probing the hours with the least observation time, so a slot that has
      # never been sampled (03:00 / 08:00 had observed_hours == 0) can still
      # accumulate evidence. 0 disables it; the plan writer reads this.
      # At the #91 timetable the gap caps already fill the whole budget
      # (`hourly_gap_minutes`), so the plan carries no probe slots; the knob is
      # kept explicit so raising the budget can turn exploration back on with
      # the same command line. See docs/history-data.md.
      FETCH_EXPLORE_FRAC: '0.15'
    steps:
      # Check out the latest branch tip so the data commit is based on current
      # master (avoids losing a concurrent code merge when the data push fails).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The trigger (local `crontab` -> `repository_dispatch` every 5 minutes,
      # plus the hourly fallback cron) wakes this workflow often so a poll can
      # land right after stations re-price; this gate keeps upstream load bounded
      # by admitting only the #91 timetable's slots (plus the
      # FETCH_MAX_AGE_MINUTES freshness safety net). The budget/freshness env
      # above is the single knob. A dispatch is not one of the planned slots, so
      # it is evaluated against the same timetable but does not consume the plan
      # budget (issue #93); other non-schedule events (push) still fetch
      # unconditionally. One upstream request per admitted run, no retries.
      - name: Decide whether to fetch (adaptive schedule)
        id: gate
        run: |
          python scripts/should_fetch.py || {
            echo "Gate failed; fetching to stay fresh"
            echo "due=true" >> "$GITHUB_OUTPUT"
          }

      - name: Download and process data
        if: steps.gate.outputs.due == 'true'
        continue-on-error: true
        run: |
           python scripts/download_data.py || echo "No new data or download failed"
           python scripts/process_data.py || echo "Processing failed"
           python scripts/update_profile.py || echo "Fetch profile update failed"
           python scripts/append_history.py || echo "History append failed"

      # Weekly Régie Bulletin: official region-level retail margins. The script
      # makes a conditional request and only rewrites the data file when the
      # bulletin actually changed, so this never produces empty commits.
      - name: Fetch Régie weekly Bulletin (retail margins)
        if: steps.gate.outputs.due == 'true'
        continue-on-error: true
        run: |
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get install -y poppler-utils || echo "poppler-utils install failed"
          fi
          python scripts/fetch_bulletin.py || echo "Bulletin fetch failed; keeping previous data"

      # Freshness / latency metrics (issue #70): one small, machine-readable
      # summary the PM agent can cite. Never blocks the data commit.
      - name: Compute freshness metrics
        if: steps.gate.outputs.due == 'true'
        continue-on-error: true
        run: |
          python scripts/metrics.py || echo "Metrics computation failed"

      - name: Enforce data size budget
        if: steps.gate.outputs.due == 'true'
        run: |
          python scripts/check_data_size.py

      - name: Commit and push if changed
        if: steps.gate.outputs.due == 'true'
        continue-on-error: true
        run: |
          sudo apt-get install -y brotli
          brotli -fZ data/stations.json -o data/stations.json.br
          brotli -fZ data/stats.json -o data/stats.json.br
          brotli -fZ data/history.json -o data/history.json.br
          [ -f data/regie-margin.json ] && brotli -fZ data/regie-margin.json -o data/regie-margin.json.br
          [ -f data/metrics.json ] && brotli -fZ data/metrics.json -o data/metrics.json.br
          for f in data/history/*.json; do
            [ -f "$f" ] || continue
            brotli -fZ "$f" -o "$f.br"
          done
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          git diff-index --quiet HEAD || git commit -m "Update gas prices data [skip ci]" || echo "Nothing to commit"
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git || echo "Push failed or no changes"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}