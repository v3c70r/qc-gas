name: Update Gas Prices Data

on:
  workflow_call:

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use existing local data
        run: echo "Using local data files - no external API fetch"

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/stations.json data/stats.json
          git diff-index --quiet HEAD || git commit -m "Use local data files [skip ci]" || echo "Nothing to commit"
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git || echo "Push failed or no changes"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}