name: Deploy Vite Site

on:
  push:
    branches: ["master"]
    paths:
      - 'src/**'
      - 'js/**'
      - 'css/**'
      - 'index.html'
      - 'public/**'
      - 'vite.config.**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
  # External trigger (issue #77 + #93): a local `crontab` (installed by
  # `scripts/install_dispatch_cron.sh`) wakes this workflow every 5 minutes, and
  # POSTs to /dispatches with `event_type: fetch-data`. The gate then decides
  # against the #91 timetable whether the wake-up may download anything: a
  # dispatch that is not due costs a checkout + gate only (no download, no
  # commit, no deploy). A dispatch is not one of the planned slots, so it does
  # not consume the plan's request budget.
  repository_dispatch:
    types: [fetch-data]
  schedule:
    # Long-interval fallback only. Measured on this repository (issue #77,
    # `data/trigger-interval.json`): GitHub throttles the schedule so hard that
    # a `*/15` cron actually ran every ~4.3 hours (p50), and even the previous
    # hourly cron only reached ~2 hours. The sub-hourly cadence comes from the
    # local dispatch trigger (`scripts/install_dispatch_cron.sh`) instead, so
    # this hourly wake is the cheapest useful safety net against a machine that
    # is off, and it is deliberately off the top of the hour to dodge the
    # scheduler's busiest minute.
    # The gate decides whether a wake-up may hit upstream, so a non-due run
    # costs a checkout + gate only (no download, no deploy).
    - cron: '17 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-data:
    uses: ./.github/workflows/update-data.yml

  build-and-deploy:
    needs: update-data
    # Skip the Pages build/deploy when the gate decided this run must not poll
    # upstream (nothing changed), so we do not redeploy an identical snapshot.
    if: needs.update-data.outputs.due == 'true'
    environment:
      name: Credentials
    runs-on: ubuntu-latest
    steps:
      # Check out the *latest* branch tip instead of the schedule-time SHA.
      # update-data pushes a new data commit during this run; checking out the
      # pinned github.sha would build/deploy the stale (pre-update) snapshot.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        env:
          VITE_MAPBOX_ACCESS_TOKEN: ${{ secrets.VITE_MAPBOX_ACCESS_TOKEN }}
        run: npm run build

      - name: Copy data folder
        run: cp -r data dist/

      - name: Copy logos folder
        run: cp -r logos dist/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4