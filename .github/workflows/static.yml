name: Deploy Vite Site

on:
  push:
    branches: ["master"]
    paths:
      - 'src/**'
      - 'js/**'
      - 'css/**'
      - 'index.html'
      - 'vite.config.**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-data:
    uses: ./.github/workflows/update-data.yml

  build-and-deploy:
    needs: update-data
    environment:
      name: Credentials
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        env:
          VITE_MAPBOX_ACCESS_TOKEN: ${{ secrets.VITE_MAPBOX_ACCESS_TOKEN }}
        run: npm run build

      - name: Copy data folder
        run: cp -r data dist/

      - name: Copy logos folder
        run: cp -r logos dist/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4