name: Deploy Vite Site

on:
  push:
    branches: ["master"]
    paths:
      - 'src/**'
      - 'js/**'
      - 'css/**'
      - 'index.html'
      - 'public/**'
      - 'vite.config.**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
  schedule:
    # Wake often so a poll can land right after stations re-price; the
    # update-data gate decides which of these wake-ups may hit upstream, so a
    # non-due run costs a checkout + gate only (no download, no deploy).
    - cron: '*/15 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-data:
    uses: ./.github/workflows/update-data.yml

  build-and-deploy:
    needs: update-data
    # Skip the Pages build/deploy when the gate decided this run must not poll
    # upstream (nothing changed), so we do not redeploy an identical snapshot.
    if: needs.update-data.outputs.due == 'true'
    environment:
      name: Credentials
    runs-on: ubuntu-latest
    steps:
      # Check out the *latest* branch tip instead of the schedule-time SHA.
      # update-data pushes a new data commit during this run; checking out the
      # pinned github.sha would build/deploy the stale (pre-update) snapshot.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        env:
          VITE_MAPBOX_ACCESS_TOKEN: ${{ secrets.VITE_MAPBOX_ACCESS_TOKEN }}
        run: npm run build

      - name: Copy data folder
        run: cp -r data dist/

      - name: Copy logos folder
        run: cp -r logos dist/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4